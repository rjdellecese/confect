name: Packages

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-scripts:
    name: Test (scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/confect-setup
      - run: bun test ./scripts

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/confect-setup
      - run: pnpm format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/confect-setup
      - run: pnpm typecheck
      - run: pnpm typecheck:inexact

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/confect-setup
      - run: pnpm lint

  circular:
    name: Circular dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/confect-setup
      - run: pnpm circular

  test:
    name: Test (unit, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/confect-setup
      - run: pnpm exec vitest run --project @confect/alchemy --project @confect/core --project @confect/foldkit --project @confect/js --project @confect/react --project @confect/server --coverage

  test-cli:
    name: Test (cli, ${{ matrix.os }}, ${{ matrix.shard }}/4)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/confect-setup
      - run: pnpm --filter @confect/cli test --shard=${{ matrix.shard }}/4

  test-oxlint-rules:
    name: Test (oxlint-rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/confect-setup
      - run: pnpm exec vitest run --project confect-oxlint-rules

  test-mock-backend:
    name: Test (mock-backend, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/confect-setup
      - run: pnpm test:server:mock-backend

  test-local-backend:
    name: Test (local-backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/confect-setup
      - name: Cache convex local-backend binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/convex/binaries
          key: convex-local-backend-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            convex-local-backend-${{ runner.os }}-
      - run: pnpm test:server:local-backend
      - run: pnpm test:js:local-backend

  codegen-fixtures:
    name: Codegen (fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/confect-setup
      - name: Cache convex local-backend binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/convex/binaries
          key: convex-local-backend-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            convex-local-backend-${{ runner.os }}-
      - run: pnpm codegen:server:mock-backend
      - run: pnpm codegen:local-backend
      - uses: ./.github/actions/verify-codegen-committed
        with:
          path: packages/server/test/mock-backend/fixtures
      - uses: ./.github/actions/verify-codegen-committed
        with:
          path: tools/local-backend/fixtures

  bench:
    name: Bench
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ["@confect/core", "@confect/server"]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/confect-setup
      - run: pnpm --filter ${{ matrix.package }} bench

  pack-contents:
    name: Pack contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/confect-setup
      - run: pnpm build
      - run: pnpm check:pack-contents

  packed-consumers:
    name: Packed ${{ matrix.profile == 'react' && 'React' || 'Foldkit' }} app (${{ matrix.manager }}, ${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [react, foldkit]
        manager: [npm, pnpm]
        lane: [baseline, fresh]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/confect-setup
      - run: pnpm check:consumers --profile ${{ matrix.profile }} --lane ${{ matrix.lane }} --manager ${{ matrix.manager }} --report ${{ runner.temp }}/consumer-result.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: consumer-${{ matrix.profile }}-${{ matrix.manager }}-${{ matrix.lane }}
          path: ${{ runner.temp }}/consumer-result.json
          if-no-files-found: error

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/confect-setup
