packages:
  - packages/*
  - tools/*
  - apps/*
  - packages/server/test/mock-backend/fixtures
  - packages/server/test/local-backend/fixtures

allowBuilds:
  "@parcel/watcher": false
  "@scarf/scarf": false
  "@swc/core": false
  esbuild: false
  keytar: false
  msgpackr-extract: false
  opensrc: false
  puppeteer: false
  sharp: true

# pnpm's supply-chain policy rejects a lockfile referencing anything published
# within `minimumReleaseAge` (24 hours by default), which every same-day Effect
# prerelease bump trips. These entries are the escape hatch pnpm writes itself;
# they are safe to delete once the versions named here have aged past the
# cutoff.
minimumReleaseAgeExclude:
  - "@effect/platform-bun@4.0.0-rc.111"
  - "@effect/platform-node-shared@4.0.0-rc.111"
  - "@effect/platform-node@4.0.0-rc.111"
  - "@effect/vitest@4.0.0-rc.111"
  - effect@4.0.0-rc.111
  - foldkit@0.148.1

overrides:
  convex: 1.44.0
  effect: 4.0.0-rc.111
  react: 19.2.8
  react-dom: 19.2.8

packageExtensions:
  "@mintlify/mdx":
    peerDependencies:
      react: "*"
      react-dom: "*"
  "next-mdx-remote-client":
    peerDependencies:
      react: "*"
      react-dom: "*"

peerDependencyRules:
  allowedVersions:
    # foldkit pins an exact effect prerelease; the `overrides` entry above
    # already forces every resolved effect instance to the workspace version.
    "foldkit>effect": "4"
    react: "19"
    react-dom: "19"
