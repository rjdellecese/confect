packages:
  - packages/*
  - apps/*
  - packages/server/test/mock-backend/fixtures
  - packages/server/test/local-backend/fixtures

allowBuilds:
  "@parcel/watcher": false
  "@scarf/scarf": false
  "@swc/core": false
  esbuild: false
  keytar: false
  msgpackr-extract: false
  opensrc: false
  puppeteer: false
  sharp: true

# pnpm's supply-chain policy rejects a lockfile referencing anything published
# within `minimumReleaseAge` (24 hours by default), which every same-day Effect
# beta bump trips. These entries are the escape hatch pnpm writes itself; they
# are safe to delete once the versions named here have aged past the cutoff.
minimumReleaseAgeExclude:
  - "@effect/platform-bun@4.0.0-beta.103"
  - "@effect/platform-node-shared@4.0.0-beta.103"
  - "@effect/platform-node@4.0.0-beta.103"
  - "@effect/vitest@4.0.0-beta.103"
  - effect@4.0.0-beta.103

overrides:
  convex: 1.42.3
  effect: 4.0.0-beta.103
  react: 19.2.7
  react-dom: 19.2.7

packageExtensions:
  "@mintlify/mdx":
    peerDependencies:
      react: "*"
      react-dom: "*"
  "next-mdx-remote-client":
    peerDependencies:
      react: "*"
      react-dom: "*"

peerDependencyRules:
  allowedVersions:
    react: "19"
    react-dom: "19"
