name: Docs Release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Full main commit SHA containing the docs to publish
        required: true
        type: string

jobs:
  deploy-docs:
    name: Deploy docs
    permissions:
      contents: write
    uses: ./.github/workflows/docs-deploy.yml
    with:
      source_ref: ${{ inputs.source_ref }}
