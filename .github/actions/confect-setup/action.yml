name: "Confect Packages Setup"
description: "Sets up Node.js and pnpm for the confect packages"
author: "Confect"

inputs:
  build:
    description: "Build package distributions after installing dependencies"
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: ".node-version"
        cache: "pnpm"

    - uses: ./.github/actions/bun-setup

    - name: Install dependencies
      run: pnpm install
      shell: bash

    - name: Build Confect packages
      if: inputs.build == 'true'
      run: pnpm build
      shell: bash
