name: "Example App Setup"
description: "Sets up Node.js and pnpm for the example app"
author: "Confect"

runs:
  using: "composite"
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: ".node-version"
        cache: "pnpm"

    - uses: ./.github/actions/bun-setup

    - name: Install dependencies
      run: pnpm install
      shell: bash

    - name: Build confect packages (dependencies)
      run: pnpm build
      shell: bash

    - name: Generate Convex types (example)
      if: ${{ env.CONVEX_DEPLOYMENT || env.CONVEX_DEPLOY_KEY }}
      run: pnpm --filter example convex-codegen
      shell: bash
