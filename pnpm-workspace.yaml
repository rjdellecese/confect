packages:
  - packages/*
  - tools/*
  - apps/*
  - packages/server/test/mock-backend/fixtures
  - packages/server/test/local-backend/fixtures

allowBuilds:
  "@parcel/watcher": false
  "@scarf/scarf": false
  "@swc/core": false
  esbuild: false
  keytar: false
  msgpackr-extract: false
  opensrc: false
  puppeteer: false
  sharp: true
  workerd: false

minimumReleaseAgeExclude:
  - effect-oxlint@0.3.4
  - eslint-plugin-jsdoc@64.3.10
  - foldkit@0.165.0
  - "@alchemy.run/cloudflare-runtime@2.0.0-beta.82"
  - "@alchemy.run/floci@2.0.0-beta.82"
  - "@alchemy.run/node-utils@2.0.0-beta.82"
  - "@distilled.cloud/acme@1.0.0-rc.15"
  - "@distilled.cloud/aws@1.0.0-rc.15"
  - "@distilled.cloud/axiom@1.0.0-rc.15"
  - "@distilled.cloud/cloudflare@1.0.0-rc.15"
  - "@distilled.cloud/core@1.0.0-rc.15"
  - "@distilled.cloud/doppler@1.0.0-rc.15"
  - "@distilled.cloud/fly-io@1.0.0-rc.15"
  - "@distilled.cloud/gcp@1.0.0-rc.15"
  - "@distilled.cloud/hetzner@1.0.0-rc.15"
  - "@distilled.cloud/iceberg@1.0.0-rc.15"
  - "@distilled.cloud/infisical@1.0.0-rc.15"
  - "@distilled.cloud/neon@1.0.0-rc.15"
  - "@distilled.cloud/planetscale@1.0.0-rc.15"
  - "@distilled.cloud/prisma@1.0.0-rc.15"
  - "@distilled.cloud/railway@1.0.0-rc.15"
  - "@distilled.cloud/stripe@1.0.0-rc.15"
  - "@distilled.cloud/turso@1.0.0-rc.15"
  - "@distilled.cloud/zerossl@1.0.0-rc.15"
  - alchemy@2.0.0-beta.82

overrides:
  convex: 1.46.0
  effect: 4.0.1
  happy-dom: 20.14.5
  react: 19.3.0
  react-dom: 19.3.0

packageExtensions:
  "@mintlify/mdx":
    peerDependencies:
      react: "*"
      react-dom: "*"
  "next-mdx-remote-client":
    peerDependencies:
      react: "*"
      react-dom: "*"

peerDependencyRules:
  allowedVersions:
    react: "19"
    react-dom: "19"
