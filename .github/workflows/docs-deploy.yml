name: Deploy Docs

on:
  workflow_call:
    inputs:
      source_ref:
        description: Full main commit SHA containing the documentation to publish
        required: true
        type: string

jobs:
  deploy-docs:
    name: Deploy docs snapshot
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: docs-deployment
      queue: max
    permissions:
      contents: write

    steps:
      - name: Checkout deployment tooling
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch main and published tags
        run: git fetch --tags origin refs/heads/main:refs/remotes/origin/main

      - name: Checkout docs deployment branch
        uses: actions/checkout@v7
        with:
          path: docs-release
          ref: release

      - uses: ./.github/actions/docs-setup

      - name: Prepare docs snapshot
        env:
          DOCS_SOURCE_SHA: ${{ inputs.source_ref }}
        run: bash scripts/prepareDocs.sh "$DOCS_SOURCE_SHA" docs-release

      - name: Validate docs snapshot
        working-directory: docs-release/apps/docs
        run: |
          "$GITHUB_WORKSPACE/apps/docs/node_modules/.bin/mintlify" validate
          "$GITHUB_WORKSPACE/apps/docs/node_modules/.bin/mintlify" broken-links

      - name: Update docs deployment branch
        env:
          DOCS_SOURCE_SHA: ${{ inputs.source_ref }}
        run: |
          if git -C docs-release diff --cached --quiet; then
            echo "The documentation deployment is already up to date."
            exit 0
          fi

          git -C docs-release config user.name "github-actions[bot]"
          git -C docs-release config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C docs-release commit -m "Deploy documentation from ${DOCS_SOURCE_SHA}"
          git -C docs-release push origin HEAD:refs/heads/release
