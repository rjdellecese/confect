name: "Monorepo Setup"
description: "Sets up Node.js and pnpm and installs dependencies for the entire monorepo"
author: "Confect"

runs:
  using: "composite"
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: ".node-version"
        cache: "pnpm"

    - name: Install dependencies
      run: pnpm install
      shell: bash

    - name: Generate Convex types (example)
      if: ${{ env.CONVEX_DEPLOYMENT || env.CONVEX_DEPLOY_KEY }}
      run: pnpm --filter example convex-codegen
      shell: bash
