name: Release

on:
  push:
    branches:
      - main
      - v10

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - uses: ./.github/actions/bun-setup

      - name: Install dependencies
        run: pnpm install

      - name: Create release pull request or publish
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release

      - name: Update docs deployment branch
        if: steps.changesets.outputs.published == 'true' && github.ref_name == 'main'
        run: |
          git fetch origin release || true
          git push --force-with-lease origin HEAD:refs/heads/release
