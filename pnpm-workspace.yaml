packages:
  - packages/*
  - tools/*
  - apps/*
  - packages/server/test/mock-backend/fixtures
  - packages/server/test/local-backend/fixtures

allowBuilds:
  "@parcel/watcher": false
  "@scarf/scarf": false
  "@swc/core": false
  esbuild: false
  keytar: false
  msgpackr-extract: false
  opensrc: false
  puppeteer: false
  sharp: true

minimumReleaseAgeExclude:
  - effect-oxlint@0.3.4
  - eslint-plugin-jsdoc@64.3.10
  - foldkit@0.165.0

overrides:
  convex: 1.45.0
  effect: 4.0.0
  react: 19.3.0
  react-dom: 19.3.0

packageExtensions:
  "@mintlify/mdx":
    peerDependencies:
      react: "*"
      react-dom: "*"
  "next-mdx-remote-client":
    peerDependencies:
      react: "*"
      react-dom: "*"

peerDependencyRules:
  allowedVersions:
    react: "19"
    react-dom: "19"
