packages:
  - packages/*
  - apps/*
  - packages/server/test/mock-backend/fixtures
  - packages/server/test/local-backend/fixtures

allowBuilds:
  "@parcel/watcher": false
  "@scarf/scarf": false
  "@swc/core": false
  esbuild: false
  keytar: false
  msgpackr-extract: false
  opensrc: false
  puppeteer: false
  sharp: true

minimumReleaseAgeExclude:
  - "@effect/platform-bun@4.0.0-beta.104"
  - "@effect/platform-node-shared@4.0.0-beta.104"
  - "@effect/platform-node@4.0.0-beta.104"
  - "@effect/vitest@4.0.0-beta.104"
  - effect@4.0.0-beta.104

overrides:
  convex: 1.43.0
  effect: 4.0.0-beta.104
  react: 19.2.8
  react-dom: 19.2.8

packageExtensions:
  "@mintlify/mdx":
    peerDependencies:
      react: "*"
      react-dom: "*"
  "next-mdx-remote-client":
    peerDependencies:
      react: "*"
      react-dom: "*"

peerDependencyRules:
  allowedVersions:
    react: "19"
    react-dom: "19"
