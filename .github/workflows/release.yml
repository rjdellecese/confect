name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    outputs:
      docs_version: ${{ steps.docs_version.outputs.version }}
      published: ${{ steps.changesets.outputs.published }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install

      - name: Determine docs version
        id: docs_version
        run: |
          package_version=$(node -p "require('./packages/core/package.json').version")
          echo "version=v${package_version%%.*}" >> "$GITHUB_OUTPUT"

      - name: Create release pull request or publish
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release

      - name: Close stale release pull request
        if: steps.changesets.outputs['has-changesets'] == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version_branch="changeset-release/${GITHUB_REF_NAME}"
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$version_branch" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr close "$number" --repo "$GITHUB_REPOSITORY" --comment "Closing because this branch no longer has pending changesets or unpublished packages."
          fi

  deploy-docs:
    name: Deploy docs
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/docs-deploy.yml
    with:
      source_ref: ${{ github.sha }}
      version: ${{ needs.release.outputs.docs_version }}
